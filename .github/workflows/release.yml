name: Downloadable releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['packaging/**', '.cargo/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 xvfb
      - name: Test workspace
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --locked --workspace --release --target ${{ matrix.target }}
      - name: Assemble complete runtime package
        run: python packaging/package.py --target ${{ matrix.target }}
      - name: Install Windows dependency inspector
        if: runner.os == 'Windows'
        run: python -m pip install pefile==2024.8.26
      - name: Smoke test packaged binaries (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/smoke.py
      - name: Smoke test packaged binaries (Windows and macOS)
        if: runner.os != 'Linux'
        run: python packaging/smoke.py
      - name: Build single-download Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = (Resolve-Path release-assets/*Setup.exe).Path
          $installDir = Join-Path $env:RUNNER_TEMP 'Toolkit installation test'
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          foreach ($file in @('TF2_Demo_Toolkit.exe', 'TF2_Demo_Director.exe', 'export_all.exe', 'recording_resources_archive')) {
            if (!(Test-Path (Join-Path $installDir $file))) { throw "Installer omitted $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="beta-${GITHUB_RUN_NUMBER}-${COMMIT:0:7}"
          fi
          cat > ../release-notes.md <<'NOTES'
          Ready-to-run TF2 Demo Toolkit packages. No Rust, Cargo, Visual Studio, Python, or .NET installation is required.

          - **Windows x64:** download **TF2-Demo-Toolkit-Windows-x64-Setup.exe** and run it. The installer includes Toolkit, Director, the parser, and recording assets. A portable ZIP is also available; extract it completely.
          - **macOS:** choose **arm64** for Apple Silicon or **x64** for Intel, unzip, and open the app. These beta builds are ad-hoc signed, not Apple-notarized; macOS may require approval in Privacy & Security.
          - **Linux x64:** extract the tar.gz and run `./TF2_Demo_Toolkit.sh`. Requires glibc 2.35+ (Ubuntu 22.04 or newer or equivalent), a graphical X11/Wayland desktop, and system graphics drivers. Runtime libraries are included; no compiler is needed.

          HLAE recording is Windows-only. TF2, HLAE, and FFmpeg are separate recording requirements. Download a package above rather than GitHub's automatically generated source-code archives.

          CI checks workspace tests, packaged binary startup, Windows runtime imports and installer contents, and macOS library dependencies. These checks are not a substitute for testing the complete recording workflow on a clean end-user machine. Windows builds are unsigned and may show SmartScreen prompts.
          NOTES
          if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$REPOSITORY" --target "$COMMIT" --title "TF2 Demo Toolkit $tag" --prerelease --notes-file ../release-notes.md
          fi
          gh release upload "$tag" ./* --repo "$REPOSITORY" --clobber
