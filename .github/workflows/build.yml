name: Rust workspace

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 xvfb

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Capture responsive UI at supported window sizes
        if: runner.os == 'Linux'
        run: |
          cargo build --bin tf2-demo-toolkit
          xvfb-run -a -s "-screen 0 1920x1080x24" env SLINT_BACKEND=winit-software TF2_TOOLKIT_UI_SNAPSHOTS=ui-snapshots target/debug/tf2-demo-toolkit

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: responsive-ui-snapshots
          path: ui-snapshots/*.ppm

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tf2-demo-toolkit.exe dist/TF2_Demo_Toolkit.exe
          Copy-Item target/release/export_all.exe dist/export_all.exe
          Copy-Item recording_resources_archive dist/recording_resources_archive -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: TF2-Demo-Toolkit-Windows
          path: dist/*
